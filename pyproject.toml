[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clouddocs-ai"
version = "0.1.0"
description = "A Retrieval-Augmented Generation application for document question-answering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "aiofiles>=24.1.0",
    "streamlit>=1.38.0",
    "plotly>=5.18.0",
    "scikit-learn>=1.4.0",
    "google-genai>=2.30.0",
    "openai>=3.30.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B008"]  # Line length, sys.path imports, and FastAPI Depends() argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
