[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clouddocs-ai"
version = "0.1.0"
description = "A Retrieval-Augmented Generation application for document question-answering"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B008"]  # Line length, sys.path imports, and FastAPI Depends() argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
